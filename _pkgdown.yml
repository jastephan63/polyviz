# pkgdown configuration. The built site lives under docs/reference/ - the
# hand-made chart gallery owns the docs/ root (docs/index.html and
# docs/lib), so pkgdown writes into its own subfolder and never touches
# them.
url: https://jastephan63.github.io/polyviz/reference
destination: docs/reference

authors:
  Jake Stephan:
    href: https://github.com/jastephan63

template:
  bootstrap: 5
  # The light/dark toggle defaults to following the viewer's system
  # preference - matching the charts, whose "auto" mode does the same.
  light-switch: true
  # Brand-adjacent colours: the warm paper surface and the first
  # categorical blue of the packaged chart theme (see pv_colors).
  bslib:
    bg: "#fbf9f5"
    fg: "#161511"
    primary: "#006ba2"

reference:
- title: Charts
  desc: >
    Every chart function returns an htmlwidget rendered by the bundled
    D3.js v7 - interactive, animated, and theme-aware. All of them share
    the same title/subtitle/mode/source options.
  contents:
  - pv_bar
  - pv_line
  - pv_area
  - pv_scatter
  - pv_pairs
  - pv_lollipop
  - pv_slope
  - pv_dumbbell
  - pv_waterfall
  - pv_bullet
  - pv_donut
  - pv_waffle
  - pv_treemap
  - pv_sunburst
  - pv_icicle
  - pv_pack
  - pv_dendrogram
  - pv_histogram
  - pv_boxplot
  - pv_violin
  - pv_ridgeline
  - pv_beeswarm
  - pv_heatmap
  - pv_calendar
  - pv_horizon
  - pv_bump
  - pv_parallel
  - pv_sankey
  - pv_chord
  - pv_force
  - pv_arc
  - pv_choropleth
  - pv_bubble_map
  - pv_flow_map
  - pv_race
  - pv_table

- title: Chart layers & linking
  desc: >
    Pipe-able modifiers - annotations, fitted trends, texture fills,
    small multiples, and crosstalk selection linking - that layer onto
    an existing chart.
  contents:
  - pv_annotate
  - annotations
  - pv_trend
  - pv_textures
  - pv_facet
  - pv_link

- title: Composition & time series
  desc: >
    Several finished charts composed into one page, and the three
    time-series tools - seasonal decomposition, forecast fans, and
    changepoint marks - computed entirely in base R's stats and drawn
    by the chart machinery that already exists.
  contents:
  - pv_board
  - pv_decompose
  - pv_forecast
  - pv_changepoints

- title: Papers & export
  desc: >
    Getting charts out of the browser and onto a page - print-quality
    PNG/SVG/PDF, animated GIFs of the race, self-contained HTML files,
    whole PowerPoint decks, plus the in-chart download control.
    (Knitting to Word or PDF needs no function call at all - a chart in
    a chunk becomes a figure by itself.)
  contents:
  - pv_save
  - pv_deck
  - pv_downloads
  - pv_static

- title: Alt text
  desc: >
    Every chart carries a generated description of itself, for screen
    readers and knitted documents - read it, or replace it with your
    own words.
  contents:
  - pv_alt_text
  - pv_alt

- title: Data in & out
  desc: >
    One reader that dispatches on file extension, plus direct access to
    the SQLite and SAS backends.
  contents:
  - pv_read
  - pv_read_sas
  - pv_write_sas
  - pv_labels
  - pv_set_labels
  - pv_db_connect
  - pv_db_disconnect
  - pv_db_write
  - pv_db_tables
  - pv_query
  - pv_run_sql_file

- title: Swiss open data
  desc: >
    Live access to the portals the bundled datasets come from - search
    the opendata.swiss catalogue, fetch from the BFS and LUSTAT, pull
    the country-wide boundary layers, and manage the shared download
    cache. Every fetch states its source and licence terms.
  contents:
  - pv_search_opendata
  - pv_fetch_opendata
  - pv_fetch_bfs
  - pv_fetch_lustat
  - pv_fetch_map
  - pv_cache_status

- title: Analysis
  desc: >
    Summaries, numeric profiling (Python-backed when available, pure R
    otherwise), outlier flags, the one-call HTML report, plus the two
    guides - the chart adviser and the live demo app.
  contents:
  - pv_summary
  - pv_profile
  - pv_outliers
  - pv_py_available
  - pv_plot_corr
  - pv_plot_missing
  - pv_report
  - pv_suggest
  - pv_demo

- title: Theming & locale
  desc: >
    The packaged colour tokens, palette accessors and ggplot2 scales,
    the session theme API with its accessibility checker, the
    print-first paper theme, and locale-aware number and date
    formatting.
  contents:
  - pv_colors
  - pv_palette
  - pv_set_theme
  - pv_reset_theme
  - pv_theme_paper
  - pv_check_palette
  - pv_locale
  - scale_colour_pv
  - theme_polyviz

- title: Datasets
  desc: >
    Bundled demonstration data - simulated sales and networks, plus real
    Swiss open data (cities, commuters, Lucerne fiscal equalization,
    elections, boundaries, weather, electricity, and tourism).
  contents:
  - pv_sales
  - pv_network
  - pv_flows
  - pv_city_population
  - pv_city_sectors
  - pv_city_landuse
  - pv_commuters
  - pv_fiscal
  - pv_elections
  - pv_lucerne_map
  - pv_swiss_cantons
  - pv_swiss_districts
  - pv_swiss_lakes
  - pv_city_coords
  - pv_weather
  - pv_electricity
  - pv_tourism

- title: Shiny
  desc: Output and render bindings for using the charts in Shiny apps.
  contents:
  - pvchart-shiny
